    <meta name="background-color" content="#000000" />

    <meta name="apple-mobile-web-app-title" content="FirstKnock" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />
    <title>FirstKnock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Force PWA Updates on Home Screen Resume -->
    <script>
      if ('serviceWorker' in navigator) {
        // 1. Reload when new SW takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload(true);
          }
        });

        // 2. Force new service workers to skip waiting when installed
        navigator.serviceWorker.getRegistration().then(reg => {
          if (!reg) return;

          const handleUpdate = (worker) => {
            if (worker) {
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  worker.postMessage({ type: 'SKIP_WAITING' });
                  worker.postMessage('skipWaiting');
                }
              });
            }
          };

          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            reg.waiting.postMessage('skipWaiting');
          }

          if (reg.installing) {
            handleUpdate(reg.installing);
          }

          reg.addEventListener('updatefound', () => {
            handleUpdate(reg.installing);
          });
        });

        // 3. Check for updates every time app comes to foreground
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.ready.then(reg => reg.update());
          }
        });
      }
    </script>
  </body>
</html>
