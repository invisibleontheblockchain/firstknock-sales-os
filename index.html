<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="background-color" content="#000000" />
    <meta name="application-name" content="FirstKnock" />
    <meta name="apple-mobile-web-app-title" content="FirstKnock" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/695eb764b077190880be21de/147abd69b_image.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://media.base44.com/images/public/695eb764b077190880be21de/147abd69b_image.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://media.base44.com/images/public/695eb764b077190880be21de/147abd69b_image.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://firstknock.online/" />
    <title>FirstKnock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Force PWA Updates on Home Screen Resume -->
    <script>
      const FK_PWA_RELEASE = '__FK_BUILD_RELEASE__';
      window.__FK_PWA_RELEASE__ = FK_PWA_RELEASE;
      const clearOldPwaCachesOnce = async () => {
        try {
          if (!('caches' in window)) return false;
          if (localStorage.getItem('fk_pwa_release') === FK_PWA_RELEASE) return false;
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((name) => caches.delete(name)));
          localStorage.setItem('fk_pwa_release', FK_PWA_RELEASE);
          return true;
        } catch (error) {
          console.warn('PWA cache refresh skipped', error);
          return false;
        }
      };
      clearOldPwaCachesOnce().then((cacheWasCleared) => {
        if (!cacheWasCleared) return;
        const releaseUrl = new URL(window.location.href);
        releaseUrl.searchParams.set('fk_release', FK_PWA_RELEASE);
        window.location.replace(releaseUrl.toString());
      });

      if ('serviceWorker' in navigator) {
        // 1. Reload when new SW takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload(true);
          }
        });

        // 2. Force new service workers to skip waiting when installed
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(reg => {
          reg.update().catch((error) => console.warn('PWA startup update check skipped', error));

          const handleUpdate = (worker) => {
            if (worker) {
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  worker.postMessage({ type: 'SKIP_WAITING' });
                  worker.postMessage('skipWaiting');
                }
              });
            }
          };

          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            reg.waiting.postMessage('skipWaiting');
          }

          if (reg.installing) {
            handleUpdate(reg.installing);
          }

          reg.addEventListener('updatefound', () => {
            handleUpdate(reg.installing);
          });
        });

        // 3. Check for updates every time app starts or returns to foreground.
        const checkForPwaUpdate = () => {
          navigator.serviceWorker.getRegistration().then((reg) => reg?.update());
        };
        window.addEventListener('pageshow', checkForPwaUpdate);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') checkForPwaUpdate();
        });
      }
    </script>
  </body>
</html>
